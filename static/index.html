<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="theme-color" content="#1c1c1c" />
<title>ayso.ai</title>
<style>
  :root{
    --bg:#1c1c1c;
    --panel:#262626;
    --panel-2:#2e2e2e;
    --line:#333;
    --line-soft:#2a2a2a;
    --txt:#e8e8e8;
    --dim:#8a8a8a;
    --dim-2:#6b6b6b;
    --ok:#4ade80;
  }
  *{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
  html,body{height:100%}
  body{
    background:var(--bg);color:var(--txt);
    font-family:"Segoe UI",system-ui,-apple-system,Tahoma,sans-serif;
    font-size:15px;-webkit-font-smoothing:antialiased;overflow:hidden;
  }
  .app{display:flex;flex-direction:column;height:100dvh;max-width:780px;margin:0 auto;position:relative}

  /* ══ top bar ══ */
  .top{flex:0 0 auto;display:flex;align-items:center;gap:4px;padding:10px 12px;min-height:52px}
  .icobtn.act{color:#e8a95e;background:rgba(201,119,43,.16)}
  .icobtn{
    width:38px;height:38px;border:0;background:transparent;border-radius:10px;
    color:#b5b5b5;cursor:pointer;display:grid;place-items:center;transition:background .15s,color .15s;
  }
  .icobtn:hover{background:rgba(255,255,255,.06);color:#ececec}
  .icobtn:active{background:rgba(255,255,255,.1)}
  .icobtn svg{width:20px;height:20px;display:block}
  .spacer{flex:1}

  /* ══ main ══ */
  main{flex:1 1 auto;overflow-y:auto;scrollbar-width:none;position:relative}
  main::-webkit-scrollbar{display:none}

  /* ══ hero ══ */
  /* ══ الترحيب ══ */
  /* ══ مؤشر التفكير ══ */
  .thk{display:inline-flex;align-items:center;gap:9px;color:#9c9c9c;font-size:15px;
    padding:6px 0;user-select:none}
  .thk svg:first-child{width:19px;height:19px;flex:0 0 auto;opacity:.85;
    animation:thkPulse 2s ease-in-out infinite}
  .thk .ch{width:14px;height:14px;opacity:.55}
  @keyframes thkPulse{0%,100%{opacity:.85}50%{opacity:.45}}
  .thk span{letter-spacing:.2px}

  /* ══ لوحة الوضع ══ */
  .ap-row{display:flex;align-items:flex-start;gap:12px;margin:4px 14px 10px;padding:14px;
    border-radius:14px;background:rgba(255,255,255,.035);border:1px solid rgba(255,255,255,.07)}
  .ap-row.on{background:rgba(120,170,255,.09);border-color:rgba(120,170,255,.28)}
  .ap-ic{width:22px;height:22px;color:#9a9a9a;flex:0 0 auto;margin-top:1px}
  .ap-ic svg{width:22px;height:22px;display:block}
  .ap-row.on .ap-ic{color:#e8a95e}
  .ap-tx{flex:1;min-width:0}
  .ap-tt{font-size:13.5px;color:#ececec;font-weight:600}
  .ap-dd{font-size:11.5px;color:#8b8b8b;margin-top:4px;line-height:1.5}
  .ap-sw{flex:0 0 auto;width:44px;height:26px;border-radius:14px;border:0;cursor:pointer;
    background:rgba(255,255,255,.13);position:relative;transition:background .2s;padding:0}
  .ap-sw i{position:absolute;top:3px;left:3px;width:20px;height:20px;border-radius:50%;
    background:#55575c;transition:transform .22s cubic-bezier(.3,0,.2,1),background .2s;display:block}
  .ap-sw[aria-checked="true"]{background:#c9772b}
  .ap-sw[aria-checked="true"] i{transform:translateX(18px);background:#fff}
  .ap-note{font-size:11.5px;color:#7f7f7f;padding:0 20px 18px;line-height:1.6}

  /* ══ لوحة المحادثات ══ */
  .cvs{position:fixed;inset:0;z-index:60;background:rgba(0,0,0,.55);backdrop-filter:blur(3px);
    display:flex;align-items:flex-end}
  .cvs[hidden]{display:none}
  .cvs-panel{width:100%;max-height:78dvh;background:#17171a;border-radius:18px 18px 0 0;
    border-top:1px solid rgba(255,255,255,.09);display:flex;flex-direction:column;
    animation:cvUp .26s cubic-bezier(.3,0,.2,1)}
  @keyframes cvUp{from{transform:translateY(40px);opacity:.6}to{transform:translateY(0);opacity:1}}
  .cvs-head{display:flex;align-items:center;justify-content:space-between;padding:16px 18px 10px;
    font-size:14px;color:#fff;font-weight:600}
  .cvs-head button{background:none;border:0;color:#9a9a9a;font-size:24px;line-height:1;cursor:pointer;font-family:inherit}
  .cvs-new{margin:0 14px 10px;padding:10px;border-radius:12px;font-family:inherit;font-size:13px;
    color:#cfe4ff;background:rgba(120,170,255,.10);border:1px solid rgba(120,170,255,.22);cursor:pointer}
  .cvs-new:hover{background:rgba(120,170,255,.18)}
  .cvs-list{overflow-y:auto;padding:0 10px 18px}
  .cvs-row{display:flex;align-items:center;gap:10px;padding:11px 12px;border-radius:12px;cursor:pointer}
  .cvs-row:hover{background:rgba(255,255,255,.05)}
  .cvs-row.on{background:rgba(120,170,255,.10)}
  .cvs-row .tx{flex:1;min-width:0}
  .cvs-row .tt{font-size:13.5px;color:#e9e9e9;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .cvs-row .dd{font-size:11px;color:#7d7d7d;margin-top:3px}
  .cvs-row .del{background:none;border:0;color:#767676;font-size:17px;cursor:pointer;padding:4px 6px;font-family:inherit}
  .cvs-row .del:hover{color:#e79a9a}
  .cvs-empty{text-align:center;color:#7a7a7a;font-size:13px;padding:30px 10px}

  .achip{display:flex;align-items:center;gap:8px;margin:0 14px 6px;padding:5px 10px;border-radius:10px;
    background:rgba(120,170,255,.10);border:1px solid rgba(120,170,255,.22);
    font-size:12px;color:#cfe4ff;width:fit-content;max-width:90%}
  .achip button{background:none;border:0;color:#cfe4ff;font-size:16px;line-height:1;cursor:pointer;padding:0 2px;font-family:inherit}

  .vfy{display:flex;flex-wrap:wrap;gap:8px;align-items:center;padding:8px 2px 2px}
  .vfy .vok{font-size:12px;color:#7fcf9a;background:rgba(90,200,140,.10);border:1px solid rgba(90,200,140,.22);padding:3px 9px;border-radius:8px}
  .vfy .vbad{font-size:12px;color:#e79a9a;background:rgba(230,120,120,.10);border:1px solid rgba(230,120,120,.22);padding:3px 9px;border-radius:8px}
  .vfy .verr{font-size:11px;color:#d0a0a0;background:rgba(255,255,255,.04);padding:2px 6px;border-radius:6px;direction:ltr}
  .vfy .vfix{font-size:11.5px;color:#cfe4ff;background:rgba(120,170,255,.12);border:1px solid rgba(120,170,255,.25);padding:3px 9px;border-radius:8px;cursor:pointer;font-family:inherit}
  .vfy .vfix:hover{background:rgba(120,170,255,.2)}
  .vfy .vok em{font-style:normal;color:#9fe0b4;font-family:ui-monospace,monospace;font-size:11px}
  .vfy .vout{flex-basis:100%;margin:4px 0 0;padding:8px 10px;border-radius:8px;font-size:11.5px;
    background:rgba(0,0,0,.32);border:1px solid rgba(255,255,255,.09);color:#b6e3c4;
    direction:ltr;text-align:left;white-space:pre-wrap;overflow-x:auto;font-family:ui-monospace,monospace}
  .vfy .vout.bad{color:#e2a6a6;border-color:rgba(230,120,120,.28)}

  .hero{
    position:fixed;left:50%;top:50%;
    transform:translate(-50%,-50%);
    z-index:20;pointer-events:none;
    padding:0 20px;
    transition:top .46s cubic-bezier(.4,0,.2,1);
    will-change:top;
  }
  .hero h1{
    font-size:clamp(44px,13vw,72px);
    font-weight:600;color:#ffffff;letter-spacing:-.5px;
    direction:ltr;line-height:1.1;text-align:center;white-space:nowrap;
    transform-origin:center center;
    transition:transform .46s cubic-bezier(.4,0,.2,1),opacity .3s ease;
    text-shadow:0 0 60px rgba(255,255,255,.08);
  }
  .hero h1 small{font-weight:300;color:#c8c8c8}

  /* الحالة المثبّتة أعلى الشاشة */
  .app.chat .hero{ top:calc(env(safe-area-inset-top,0px) + 30px) }
  .app.chat .hero h1{ transform:scale(.26);text-shadow:none }
  .app.chat .hero h1 small{ color:#b8b8b8 }
  .app.chat .msgs{ padding-top:58px }

  /* ══ messages ══ */
  .msgs{display:flex;flex-direction:column;gap:22px;padding:16px 20px 24px}
  .msgs:empty{display:none}
  .msg{animation:fi .2s ease both}
  @keyframes fi{from{opacity:0;transform:translateY(5px)}to{opacity:1;transform:none}}
  .msg.u{display:flex;justify-content:flex-start}
  .msg.u .b{
    background:#2b2b2b;border-radius:18px;border-end-start-radius:6px;
    padding:11px 16px;max-width:84%;font-size:15px;line-height:1.7;
    white-space:pre-wrap;word-break:break-word;
  }
  .msg.a .who{
    font-size:11px;color:var(--dim-2);margin-bottom:7px;
    direction:ltr;font-family:ui-monospace,monospace;letter-spacing:.4px;
  }
  .msg.a .bd{font-size:15px;line-height:1.85;word-break:break-word;color:#dcdcdc}
  .msg.a .bd p{margin:10px 0}
  .msg.a .bd p:first-child{margin-top:0}
  .msg.a .bd strong{color:#fff;font-weight:600}
  .msg.a .bd code{
    background:#141414;padding:2px 6px;border-radius:5px;font-size:.86em;
    direction:ltr;display:inline-block;font-family:ui-monospace,monospace;color:#9fb4f0;
  }
  .msg.a .bd pre{
    background:#141414;border-radius:12px;padding:14px;overflow-x:auto;margin:12px 0;
    direction:ltr;text-align:left;
  }
  .msg.a .bd pre code{background:none;padding:0;color:#c6cbd6;display:block;font-size:13px}
  .msg.a .bd ul,.msg.a .bd ol{margin:10px 22px 10px 0}
  .msg.a .bd li{margin:4px 0}
  .msg.a .bd h1,.msg.a .bd h2,.msg.a .bd h3{margin:16px 0 8px;font-weight:600;line-height:1.4}
  .msg.a .bd h1{font-size:19px}.msg.a .bd h2{font-size:17px}.msg.a .bd h3{font-size:15.5px}
  .msg.a .bd blockquote{border-right:2px solid #444;padding:2px 12px;margin:10px 0;color:#a5a5a5}
  .msg.a .bd hr{border:0;border-top:1px solid #333;margin:16px 0}
  .cursor{display:inline-block;width:7px;height:15px;background:#8a8a8a;vertical-align:-2px;
    border-radius:1px;animation:bl 1.05s steps(2) infinite;margin-inline-start:2px}
  @keyframes bl{50%{opacity:0}}

  /* ══ dock ══ */
  .dock{flex:0 0 auto;padding:0 10px calc(10px + env(safe-area-inset-bottom))}

  .composer{
    background:var(--panel);border:1px solid var(--line-soft);
    border-radius:24px;padding:14px 16px 12px;transition:border-color .18s;
  }
  .composer:focus-within{border-color:#3d3d3d}
  textarea{
    width:100%;min-height:26px;max-height:160px;resize:none;
    background:transparent;border:0;outline:none;color:var(--txt);
    font:inherit;font-size:15.5px;line-height:1.6;padding:2px 0;
  }
  textarea::placeholder{color:#6f6f6f}

  .bar{display:flex;align-items:center;gap:4px;margin-top:10px}
  .bar .spacer{flex:1}
  .tool{
    width:36px;height:36px;border:0;background:transparent;border-radius:9px;
    color:#909090;cursor:pointer;display:grid;place-items:center;transition:.15s;flex:0 0 auto;
  }
  .tool:hover{background:rgba(255,255,255,.06);color:#d8d8d8}
  .tool svg{width:19px;height:19px;display:block}

  .model{
    display:inline-flex;align-items:center;gap:6px;
    background:transparent;border:0;border-radius:9px;
    padding:7px 8px;color:#9a9a9a;cursor:pointer;
    font:inherit;font-size:12.5px;flex:0 0 auto;transition:.15s;
  }
  .model:hover{background:rgba(255,255,255,.08);color:#ffffff}
  .model svg{width:25px;height:25px;display:block;flex:0 0 auto;color:#ffffff}
  .model .nm{direction:ltr;font-family:ui-monospace,monospace;font-size:11.5px;letter-spacing:.3px}
  .model .cv{width:11px;height:11px;opacity:.6;transition:transform .18s}
  .model.open .cv{transform:rotate(180deg)}

  .send{
    width:40px;height:40px;flex:0 0 auto;border-radius:11px;
    border:1px solid #3a3a3a;background:transparent;color:#c4c4c4;
    cursor:pointer;display:grid;place-items:center;transition:.16s;margin-inline-start:4px;
  }
  .send:hover:not(:disabled){background:#333;color:#fff;border-color:#4a4a4a}
  .send:active:not(:disabled){background:#3a3a3a}
  .send:disabled{opacity:.4;cursor:not-allowed}
  .send svg{width:17px;height:17px;display:block}

  .foot{text-align:center;font-size:10.5px;color:#5e5e5e;padding:9px 0 0;letter-spacing:.2px;direction:ltr}

  /* ══ model sheet ══ */
  .ov{
    position:fixed;inset:0;background:rgba(0,0,0,.62);z-index:50;
    opacity:0;pointer-events:none;transition:opacity .2s;
    display:flex;align-items:flex-end;justify-content:center;
  }
  .ov.on{opacity:1;pointer-events:auto}
  .sheet{
    width:100%;max-width:780px;background:#202020;
    border:1px solid #2e2e2e;border-bottom:0;
    border-radius:22px 22px 0 0;
    padding:8px 14px calc(16px + env(safe-area-inset-bottom));
    transform:translateY(14px);transition:transform .22s ease;
  }
  .ov.on .sheet{transform:none}
  .grab{width:38px;height:4px;border-radius:99px;background:#3d3d3d;margin:6px auto 14px}
  .sheet h3{font-size:13px;font-weight:600;color:#9e9e9e;padding:0 8px 10px;letter-spacing:.2px}

  .mrow{
    display:flex;align-items:center;gap:11px;
    padding:12px 12px;border-radius:13px;cursor:pointer;
    border:1px solid transparent;transition:.14s;background:transparent;
    width:100%;text-align:right;font:inherit;color:inherit;
  }
  .mrow:hover{background:#282828;border-color:#333}
  .mrow.sel{background:#2a2a2a;border-color:#3a3a3a}
  .mrow .sico{
    width:32px;height:32px;flex:0 0 auto;border-radius:9px;
    background:#2e2e2e;display:grid;place-items:center;color:#b0b0b0;
  }
  .mrow.sel .sico{background:#3a3a3a;color:#fff}
  .mrow .sico svg{width:23px;height:23px;display:block}
  .mrow .mtxt{flex:1;min-width:0}
  .mrow .mttl{font-size:13.5px;font-weight:600;color:#e4e4e4;direction:ltr;text-align:right;
    font-family:ui-monospace,monospace;letter-spacing:.2px}
  .mrow .msub{font-size:11px;color:#7a7a7a;margin-top:2px}
  .mrow .chk{width:16px;height:16px;flex:0 0 auto;color:var(--ok);opacity:0}
  .mrow.sel .chk{opacity:1}
  .sheet .note{font-size:11px;color:#5f5f5f;padding:12px 8px 2px;line-height:1.6;text-align:center}

  /* ══ دائرة انتظار (موج) ══ */
  .wave{display:flex;align-items:center;justify-content:flex-start;padding:3px 0;height:20px}
  .blob{
    width:19px;height:19px;background:#ffffff;
    animation: blobMorph 2.6s ease-in-out infinite, blobSpin 3.4s linear infinite;
  }
  @keyframes blobSpin{ to{ transform:rotate(360deg) } }
  @keyframes blobMorph{
    0%   { border-radius: 50% 50% 50% 50% / 50% 50% 50% 50% }
    16%  { border-radius: 58% 42% 45% 55% / 46% 58% 42% 54% }
    32%  { border-radius: 42% 58% 62% 38% / 58% 41% 59% 42% }
    48%  { border-radius: 50% 50% 50% 50% / 50% 50% 50% 50% }
    64%  { border-radius: 63% 37% 40% 60% / 41% 62% 38% 59% }
    80%  { border-radius: 45% 55% 57% 43% / 60% 44% 56% 40% }
    100% { border-radius: 50% 50% 50% 50% / 50% 50% 50% 50% }
  }

  .retry{display:inline-block;margin-top:9px;background:transparent;border:1px solid #3a3a3a;
    border-radius:8px;color:#c9c9c9;font:inherit;font-size:12px;padding:6px 13px;cursor:pointer;transition:.15s}
  .retry:hover{background:#2a2a2a;color:#fff;border-color:#4a4a4a}

  /* ══ شريط تصدير الرد ══ */
  .exp{display:flex;gap:7px;margin-top:12px;flex-wrap:wrap}
  .exp button{display:inline-flex;align-items:center;gap:5px;background:transparent;
    border:1px solid #333;border-radius:8px;color:#909090;font:inherit;font-size:11.5px;
    padding:5px 10px;cursor:pointer;transition:.15s}
  .exp button:hover{background:#262626;color:#fff;border-color:#4a4a4a}
  .exp button svg{width:13px;height:13px;display:block}

  /* ══ جداول ══ */
  .tw{overflow-x:auto;margin:14px 0;border:1px solid #2f2f2f;border-radius:10px;-webkit-overflow-scrolling:touch}
  .tw table{border-collapse:collapse;width:max-content;min-width:100%;font-size:13px}
  .tw th,.tw td{padding:9px 13px;text-align:right;border-bottom:1px solid #262626;
    border-left:1px solid #222;white-space:nowrap;vertical-align:top}
  .tw th{background:#1e1e1e;color:#e8e8e8;font-weight:600;font-size:12.5px;
    position:sticky;top:0;z-index:1}
  .tw td{color:#c9c9c9}
  .tw tr:last-child td{border-bottom:0}
  .tw tbody tr:hover td{background:#1c1c1c}
  .tw::-webkit-scrollbar{height:7px}
  .tw::-webkit-scrollbar-thumb{background:#3a3a3a;border-radius:8px}
  .tw::-webkit-scrollbar-track{background:transparent}

  /* ══ صندوق الكود ══ */
  .cbx{margin:14px 0;border:1px solid #2f2f2f;border-radius:12px;overflow:hidden;background:#141414}
  .cbx .hd{display:flex;align-items:center;gap:8px;padding:7px 11px;background:#1b1b1b;
    border-bottom:1px solid #2a2a2a}
  .cbx .lang{font-size:10.5px;color:#7c7c7c;direction:ltr;font-family:ui-monospace,monospace;
    letter-spacing:.4px;text-transform:lowercase}
  .cbx .cbtn{margin-inline-start:auto;display:inline-flex;align-items:center;gap:5px;
    background:transparent;border:1px solid #333;border-radius:7px;color:#9a9a9a;
    font:inherit;font-size:11px;padding:4px 9px;cursor:pointer;transition:.15s}
  .cbx .cbtn:hover{background:#262626;color:#ffffff;border-color:#4a4a4a}
  .cbx .cbtn.ok{color:#4ade80;border-color:rgba(74,222,128,.4);background:rgba(74,222,128,.08)}
  .cbx .cbtn svg{width:12px;height:12px;display:block}
  .msg.a .bd .cbx pre,
  .cbx pre{margin:0;padding:0;overflow-x:auto;direction:ltr;text-align:left;
    background:none;border:0;border-radius:0;font-size:0}
  .msg.a .bd .cbx pre code,
  .cbx pre code{
    background:none;border:0;border-radius:0;padding:13px 14px;margin:0;
    color:#d7dbe4;font-size:12.8px;display:block;width:max-content;min-width:100%;
    line-height:1.7;white-space:pre;tab-size:4;
    font-family:ui-monospace,Menlo,Consolas,"Courier New",monospace;
    direction:ltr;text-align:left;unicode-bidi:isolate}

  /* ══ ظهور ناعم للنص ══ */
  .bd.reveal > *{ animation: riseIn .5s cubic-bezier(.2,.7,.2,1) both }
  .bd.reveal > *:nth-child(1){ animation-delay:0s }
  .bd.reveal > *:nth-child(2){ animation-delay:.07s }
  .bd.reveal > *:nth-child(3){ animation-delay:.13s }
  .bd.reveal > *:nth-child(4){ animation-delay:.19s }
  .bd.reveal > *:nth-child(5){ animation-delay:.24s }
  .bd.reveal > *:nth-child(n+6){ animation-delay:.29s }
  @keyframes riseIn{
    from{ opacity:0; transform:translateY(7px); filter:blur(2px) }
    to  { opacity:1; transform:none;       filter:none }
  }

  /* toast */
  .toast{
    position:fixed;bottom:120px;left:50%;transform:translateX(-50%) translateY(16px);
    background:#2e2e2e;border:1px solid #3d3d3d;color:#dcdcdc;font-size:12.5px;
    padding:10px 18px;border-radius:11px;z-index:60;opacity:0;pointer-events:none;
    transition:.24s;max-width:88vw;text-align:center;
  }
  .toast.on{opacity:1;transform:translateX(-50%) translateY(0)}

  @media(min-width:640px){
    .dock{padding:0 18px 16px}
    .msgs{padding:20px 26px 28px}
  }
</style>
</head>
<body>

<div class="app">

  <div id="pvbar" style="display:none;background:#3a2f12;color:#f0dc9a;font-size:11.5px;
    line-height:1.6;padding:8px 12px;text-align:center;border-bottom:1px solid #574318">
    ⚠️ أنت في <b>معاينة</b> — الحفظ والتنزيل معطّلان، والرسائل تروح عند التحديث.<br>
    <b>نزّل الملف وافتحه في كروم</b> حتى يشتغل كل شي.

  <div class="top">

/* بعض النماذج تُخرج جدول HTML — نحوّله لجدولنا */
function htmlTableToTw(raw){
  const un = raw.replace(/&lt;/g,"<").replace(/&gt;/g,">").replace(/&quot;/g,'"');
  const rows = [...un.matchAll(/<tr[^>]*>([\s\S]*?)<\/tr>/gi)];
  if(!rows.length) return raw;
  const clean = t => t.replace(/<[^>]+>/g," ").replace(/\s+/g," ").trim();
  let head = null; const body = [];
  rows.forEach((r, i)=>{
    const cells = [...r[1].matchAll(/<t([hd])[^>]*>([\s\S]*?)<\/t\1>/gi)]
      .map(c => ({ h: c[1].toLowerCase() === "h", t: clean(c[2]) }));
    if(!cells.length) return;
    if(i === 0 && cells.some(c => c.h)) head = cells.map(c => c.t);
    else body.push(cells.map(c => c.t));
  });
  if(!head) head = body.shift() || [];
  if(!head.length) return raw;
  const th = head.map(h => `<th>${h}</th>`).join("");
  const tb = body.map(r => `<tr>${r.map(c => `<td>${c}</td>`).join("")}</tr>`).join("");
  return `<div class="tw"><table><thead><tr>${th}</tr></thead><tbody>${tb}</tbody></table></div>`;
}

function md(src){
  if(!src) return "";
  /* أثناء البث قد يكون السياج غير مغلق — نغلقه مؤقتاً حتى لا يظهر خربطة */
  const fences = (String(src).match(/```/g) || []).length;
  let s = esc(fences % 2 ? src + "\n```" : src), blk = [];
  s = s.replace(/```(\w*)\n?([\s\S]*?)```/g,(_,lang,c)=>{
    const code = c.replace(/\n$/,"");
    const lg = (lang || "").trim() || "code";
    blk.push(
      `<div class="cbx" dir="ltr"><div class="hd"><span class="lang">${esc(lg)}</span>` +
      `<button class="cbtn" data-copy="1">` +
      `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round">` +
      `<rect x="8.5" y="8.5" width="12" height="12" rx="2.5"/><path d="M15.5 5.5v-1a2 2 0 0 0-2-2h-9a2 2 0 0 0-2 2v9a2 2 0 0 0 2 2h1"/>` +
      `</svg><span>نسخ</span></button></div>` +
      `<pre style="margin:0;padding:0;border:0;border-radius:0;background:transparent;` +
      `overflow-x:auto;direction:ltr;text-align:left;font-size:0;line-height:0;white-space:normal">` +
      `<code style="display:block;margin:0;padding:12px 14px;border:0;border-radius:0;` +
      `background:transparent;color:#d7dbe4;font-size:12.8px;line-height:1.7;` +
      `font-family:ui-monospace,Menlo,Consolas,'Courier New',monospace;` +
      `white-space:pre;tab-size:4;direction:ltr;text-align:left;` +
      `unicode-bidi:isolate;min-width:100%;width:max-content">${code}</code></pre></div>`
    );
    return `\u0000${blk.length-1}\u0000`;
  });
  /* جداول HTML → جدولنا */
  s = s.replace(/&lt;table[\s\S]*?&lt;\/table&gt;/gi, m => htmlTableToTw(m));
  s = s.replace(/&lt;br\s*\/?&gt;/gi, "<br>");
  s = s.replace(/`([^`\n]+)`/g,"<code>$1</code>");
  s = s.replace(/^#{5,6}\s*(.*)$/gm,"<h4>$1</h4>")
       .replace(/^####\s*(.*)$/gm,"<h4>$1</h4>")
       .replace(/^###\s*(.*)$/gm,"<h3>$1</h3>")
       .replace(/^##\s*(.*)$/gm,"<h2>$1</h2>")
       .replace(/^#\s*(.*)$/gm,"<h1>$1</h1>");
  s = s.replace(/^\s*&gt;\s?(.*)$/gm,"<blockquote>$1</blockquote>");
  s = s.replace(/^\s*[-*•]\s+(.*)$/gm,"<li>$1</li>");
  s = s.replace(/(?:<li>[\s\S]*?<\/li>\s*)+/g,m=>`<ul>${m}</ul>`);
  s = s.replace(/\*\*([^*]+)\*\*/g,"<strong>$1</strong>");
  /* جداول markdown */
  s = s.replace(/^\|(.+)\|\s*\n\|\s*:?-{2,}:?\s*(\|\s*:?-{2,}:?\s*)*\|\s*$/gm, (m)=> "\u0001TBL\u0001" + m);
  s = s.replace(/\u0001TBL\u0001([\s\S]*?)(?=\n\s*\n|$)/g, (m, block)=>{
    const rows = block.trim().split("\n").filter(r=> r.trim().startsWith("|"));
    if(rows.length < 2) return block;
    const cells = r => r.trim().replace(/^\|/,"").replace(/\|$/,"").split("|").map(c=> c.trim());
    const head = cells(rows[0]);
    const body = rows.slice(2).map(cells);
    const th = head.map(h=> `<th>${h}</th>`).join("");
    const tb = body.map(r=> `<tr>${r.map(c=> `<td>${c}</td>`).join("")}</tr>`).join("");
    return `<div class="tw"><table><thead><tr>${th}</tr></thead><tbody>${tb}</tbody></table></div>`;
  });

  s = s.replace(/^\s*(?:---|\*\*\*)\s*$/gm,"<hr>");
  s = s.split(/\n{2,}/).map(p => {
    if(p.indexOf("\u0000") !== -1) return p;          /* كتلة كود */
    const t = p.trim();
    const inline = /<p|<li|<ul|<ol|<h\d|<div|<pre|<blockquote|<table|<tr|<thead/.test(p);
    return inline ? p : `<p>${p.replace(/\n/g,"<br>")}</p>`;
  }).join("\n");
  return s.replace(/\u0000(\d+)\u0000/g,(_,i)=>blk[i]);
}

/* ══════════ أداة الحاسبة — تنفيذ حقيقي لا تخمين ══════════ */
function safeCalc(expr){
  const clean = String(expr).replace(/[٠-٩]/g, d => "٠١٢٣٤٥٦٧٨٩".indexOf(d))
                            .replace(/[×xX]/g, "*").replace(/÷/g, "/").replace(/[,\s_]/g, "");
  if(!/^[0-9+\-*/%().]+$/.test(clean) || clean.length > 200) return null;
  try{
    const v = Function("'use strict';return (" + clean + ")")();
    if(typeof v !== "number" || !isFinite(v)) return null;
    return Math.round(v * 1e10) / 1e10;
  }catch{ return null; }
}

/* يستخرج كل <<calc:...>> ويحسبها */
function runCalcs(text){
  const out = [];
  text.replace(/<<\s*calc\s*:\s*([^>]{1,200})>>/gi, (m, expr) => {
    const v = safeCalc(expr);
    out.push({ expr: expr.trim(), value: v });
    return m;
  });
  return out;
}

/* يستبدل العلامات بالناتج داخل النص */
function fillCalcs(text, results){
  let i = 0;
  return text.replace(/<<\s*calc\s*:\s*([^>]{1,200})>>/gi, () => {
    const r = results[i++];
    return r && r.value !== null ? String(r.value) : "؟";
  });
}

/* ══════════ تحقق حقيقي: تنفيذ/فحص الكود فعلياً، لا رأي نموذج ══════════ */
function verifyBlocks(text){
  const out = [];
  const re = /```(js|javascript|ts|typescript)\s*\n([\s\S]*?)```/gi;
  let m;
  while((m = re.exec(text))){
    const code = m[2];
    try{
      new Function(code);
      out.push({ ok:true, code, lines: code.split("\n").length });
    }catch(e){
      out.push({ ok:false, code, err: e.message, lines: code.split("\n").length });
    }
  }
  return out;
}

/* تنفيذ حقيقي: يشغّل الكود ويلتقط console */
function execJS(code){
  const logs = [];
  const line = a => a.map(x=>{
    try{ return (x !== null && typeof x === "object") ? JSON.stringify(x) : String(x); }
    catch{ return String(x); }
  }).join(" ");
  const put = (pre, a) => { logs.push(pre + line(a)); };
  const fake = { log:(...a)=>{ put("", a); }, error:(...a)=>{ put("⚠ ", a); },
                 warn:(...a)=>{ put("⚠ ", a); }, info:(...a)=>{ put("", a); } };
  try{
    /* تعبير من سطر واحد يُرجَع كقيمة؛ كتلة كود تُنفَّذ كبيان */
    const isExpr = !/[;\n]/.test(code.trim()) &&
                   !/^(function|const|let|var|for|while|if|class|return|do|switch)\b/.test(code.trim());
    const fn = new Function("console", isExpr ? "return (" + code + ")" : code);
    const ret = fn(fake);
    if(ret !== undefined) logs.push("→ " + (typeof ret === "object" ? JSON.stringify(ret) : String(ret)));
    return { ok:true, out: logs.join("\n") };
  }catch(e){
    return { ok:false, err: e.message, out: logs.join("\n") };
  }
}

function verifyBadge(results, q){
  if(!results.length) return null;
  const wrap = document.createElement("div");
  wrap.className = "vfy";
  const good = results.filter(r => r.ok).length;
  const bad  = results.length - good;

  if(bad === 0){
    wrap.innerHTML = `<span class="vok">✅ تحقّق: ${good} كود سليم الصياغة</span>`;
    const run = document.createElement("button");
    run.className = "vfix";
    run.textContent = "▶ تشغيل";
    run.onclick = ()=>{
      const src = results.filter(r => r.ok).map(r => r.code).join("\n");
      const r = execJS(src);
      run.remove();
      const box = document.createElement("pre");
      box.className = "vout";
      box.textContent = r.ok ? (r.out || "(بلا مخرجات)") : ("خطأ: " + r.err + (r.out ? "\n" + r.out : ""));
      if(!r.ok) box.classList.add("bad");
      wrap.appendChild(box);
    };
    wrap.appendChild(run);
  }else{
    wrap.innerHTML = `<span class="vbad">❌ ${bad} كود فيه خطأ صياغة</span>` +
      results.filter(r=>!r.ok).slice(0,2)
        .map(r => `<code class="verr">${esc(String(r.err).slice(0,120))}</code>`).join("");
    const b = document.createElement("button");
    b.className = "vfix";
    b.textContent = "أرسل الخطأ للنموذج ليصلحه";

      if(S.busy) return;

      ta.dispatchEvent(new Event("input"));
      $("#form").requestSubmit();
    };
    wrap.appendChild(b);
  }
  return wrap;
}

function cardFor(q){
  for(const c of CARDS) if(c.re.test(q)) return c;
  return CARDS[CARDS.length - 1];
}

/* الاختيار حسب المجموعة النشطة */
function sysFor(group, q){
  const base = !group ? SYS : group.mode === "race" ? SYS_STRICT : SYS_DEEP;
  const card = q ? cardFor(q) : null;
  return card ? base + "\n\nنوع المهمة: " + card.k + "\n" + card.hint : base;
}

/* حرارة النداء الحالي — تضبطها بطاقة المهمة */
let TEMP = 0.7;

/* وضع التفكير العميق — للنموذج القوي فقط */
let DEEP = false;
try{ DEEP = localStorage.getItem("ayso.deep") === "1"; }catch{}

/* نداء نموذج واحد، يعيد النص الكامل. onDelta(نص) أثناء البث. */
async function callModel(modelId, messages, maxTokens, signal, onDelta, timeoutMs = 90000){
  /* مهلة داخلية حتى لا يتعلّق الطلب للأبد */
  const local = new AbortController();
  const tmr = setTimeout(()=> local.abort(new Error("timeout")), timeoutMs);
  const onAbort = ()=> local.abort();
  if(signal) signal.addEventListener("abort", onAbort, { once:true });

  try{
  const r = await fetch(ENDPOINT, {
    method: "POST",
    signal: local.signal,
    headers: HEADERS,
    body: JSON.stringify({
      model: modelId,
      messages,
      temperature: TEMP,
      max_tokens: maxTokens,
      stream: true,
      ...(DEEP && FORCE_REASONING.has(modelId) ? { reasoning: { enabled: true, budget: 2000 } }
        : NO_THINK.has(modelId) ? { reasoning: { enabled: false } } : {}),
    }),
  });

  if(!r.ok){
    let msg = "HTTP " + r.status;
    try{ const t = await r.text(); const j = JSON.parse(t); msg = j?.error?.message || msg; }catch{}
    throw new Error(msg);
  }

  let acc = "", served = modelId;
  const rd = r.body.getReader(), dec = new TextDecoder();
  let buf = "";
  while(true){
    const { done, value } = await rd.read();
    if(done) break;
    buf += dec.decode(value, { stream:true });
    const lines = buf.split("\n"); buf = lines.pop() || "";
    for(const ln of lines){
      const t = ln.trim();
      if(!t.startsWith("data:")) continue;
      const p = t.slice(5).trim();
      if(p === "[DONE]") continue;
      try{
        const j = JSON.parse(p);
        if(j.error) throw new Error(j.error.message || "خطأ من الوسيط");
        if(j.model) served = j.model;
        const dl = j.choices?.[0]?.delta || {};
        /* تجاهل نص التفكير الداخلي بالكامل */
        const d = dl.content;
        if(d){ acc += d; onDelta && onDelta(acc); }
      }catch{}
    }
  }
  if(!acc.trim()) throw new Error("ردٌ فارغ");
  return { text: acc, served };
  } catch(e){
    /* أي إلغاء (من الزر أو المهلة) = توقّف مقصود، مو خطأ */
    const timeoutHit = local.signal.aborted && !(signal && signal.aborted);
    if(timeoutHit){
      throw new Error("تجاوز الوقت — جرّب مرة ثانية");
    }
    if(local.signal.aborted || (signal && signal.aborted) || String(e?.name) === "AbortError"){
      throw Object.assign(new Error("stopped"), { name:"AbortError" });
    }
    throw e;
  } finally {
    clearTimeout(tmr);
    if(signal) signal.removeEventListener("abort", onAbort);
  }
}

/* AY-3.0 — سباق: كل النماذج السريعة تُسأل بالتوازي، أول رد كامل يفوز */
/* نداء مع إعادة محاولة — تباعد متزايد (المزوّد يفشل ~١٠٪ تحت الضغط) */
async function callRetry(mid, messages, maxTokens, signal, onDelta, timeoutMs = 90000, tries = 5){
  const WAIT = [600, 1400, 3000, 6000];
  let last;
  for(let k = 0; k < tries; k++){
    try{ return await callModel(mid, messages, maxTokens, signal, onDelta, timeoutMs); }
    catch(e){
      last = e;
      const aborted = e.name === "AbortError" || S.stopped || (signal && signal.aborted)
                      || /abort/i.test(e.message || "");
      if(aborted) throw e;
      const perm = /\b4\d\d\b/.test(e.message || "") && !/429/.test(e.message || "");
      if(perm || k === tries - 1) throw e;
      await new Promise(r => setTimeout(r, WAIT[k] + Math.random() * 400));
    }
  }
  throw last;
}

async function runRace(pool, messages, maxTokens, node, bd, who){
  const ctrls = pool.slice(0,3).map(()=> new AbortController());
  const links = [];
  S.aborter = { abort: ()=> ctrls.forEach(c=>c.abort()) };

  who.innerHTML = `<span class="nm">${esc(activeGroup().id)}</span>`;
  bd.innerHTML = waveHTML();

  return new Promise((resolve, reject)=>{
    let done = false, alive = 0;
    let leader = -1;
    pool.slice(0,3).forEach((mid, i)=>{
      alive++;
      callModel(mid, messages, maxTokens, ctrls[i].signal, txt=>{
        if(done) return;
        if(leader === -1) leader = i;
        if(leader !== i) return;          /* نموذج واحد فقط يرسم */
        bd.innerHTML = md(txt) + '<span class="cursor"></span>';
        scrollDown();
      })
      .then(res=>{
        if(done) return;
        done = true;
        ctrls.forEach((c, k)=>{ if(k!==i) c.abort(); });
        resolve({ ...res, winner: mid, racers: pool.length });
      })
      .catch(err=>{
        links.push(err.message);
        if(--alive === 0 && !done){
          done = true;
          const stopped = S.stopped || links.every(l => /abort|stopped/i.test(l));
          if(stopped){ reject(Object.assign(new Error("stopped"),{name:"AbortError"})); return; }
          /* احتياطي: جرّب نموذجاً واحداً أخيراً بدل الفشل */
          (async ()=>{
            try{
              const r = await callModel(BACKUP, messages, maxTokens, ctrls[0]?.signal, txt=>{
                bd.innerHTML = md(txt) + '<span class="cursor"></span>';
                scrollDown();
              }, 60000);
              resolve({ ...r, winner: BACKUP, racers: pool.length });
            }catch(e2){ reject(new Error(links[0] || e2.message || "فشل الكل")); }
          })();
        }
      });
    });
  });
}

/* ══════════════════════════════════════════════════════════
   AY-3.1 — تعاون حقيقي
   المرحلة ١: كل النماذج تحل نفس المهمة بالتوازي (بلا بث)
   المرحلة ٢: نموذج يدمج الحلول في جواب واحد (بث مرة واحدة)
   ══════════════════════════════════════════════════════════ */
async function runTeam(messages, maxTokens, bd, who){
  const ctrl = new AbortController();
  S.aborter = ctrl;
  const sig = ctrl.signal;
  const gid = activeGroup().id;
  const q   = messages[messages.length - 1].content;
  const sys = sysFor(activeGroup(), q);
  const past = messages.filter(m => m.role !== "system").slice(0, -1).slice(-8);
  const fail = ()=> { throw Object.assign(new Error("stopped"), { name:"AbortError" }); };

  who.innerHTML = `<span class="nm">${esc(gid)}</span>`;

  /* ══ كتابة مباشرة بأقوى نموذج — بث حي، بلا مراحل وسيطة ══ */
  bd.innerHTML = DEEP ? thinkHTML() : waveHTML();
  let draft = null;
  try{
    draft = await callRole("write", [{ role:"system", content: sys }, ...past, { role:"user", content: q }],
      maxTokens, sig, txt => { bd.innerHTML = md(txt) + '<span class="cursor"></span>'; scrollDown(); }, 120000);
  }catch(e){ if(e.name === "AbortError" || S.stopped) fail(); }

  if(!draft || !draft.text.trim()) throw new Error("تعذّر إنشاء الجواب");
  if(S.stopped) fail();

  return { text: draft.text, served:"deep", enhanced:false };
}

/* ══ الإرسال ══ */
$("#form").onsubmit = async e => {
  e.preventDefault();
  let txt = ta.value.trim();
  if(!txt){
    if(!composing) toast("اكتب رسالتك أولاً");
    return;
  }
  if(S.busy) return;

  const g = activeGroup();

  /* إرفاق ملف؟ يُضمّن داخل الرسالة ويُرسل مرة واحدة */
  let attachBanner = null;
  if(ATTACH){
    const head = `\n\n— محتوى الملف «${ATTACH.name}» —\n`;
    const body = ATTACH.text.slice(0, 14000);
    txt = txt + head + body + "\n— نهاية الملف —";
    attachBanner = ATTACH.name;
    ATTACH = null;
    renderAttach();
  }

  showHero(false);                 /* افتح الشات فوراً وقبل أي شي */
  ta.value = ""; ta.style.height = "auto";
  addUser(attachBanner ? txt.split("\n\n— محتوى الملف")[0] + `\n\n📎 ${attachBanner}` : txt);
  S.history.push({ role:"user", content: txt });
  saveHist();                       /* احفظ فوراً — لا تنتظر الرد */

  const node = addAI();
  const bd = node.querySelector(".bd");
  const who = node.querySelector(".who");

  S.busy = true; setSendMode(true);

  if(!API_KEY){
    bd.innerHTML = "<p>الواجهة جاهزة ✓ — بانتظار المفتاح.</p>";
    S.busy = false; setSendMode(false);
    return;
  }

  /* قصّ السياق: آخر ١٢ رسالة وبحد ٢٤٠٠٠ حرف */
  const ctx = [];
  let budget = 24000;
  for(let i = S.history.length - 1; i >= 0 && ctx.length < 12; i--){
    const m = S.history[i];
    const c = String(m.content || "");
    if(c.length > budget) break;
    budget -= c.length;
    ctx.unshift(m);
  }
  const card = cardFor(txt);
  TEMP = card.t;
  const messages = [{ role:"system", content: sysFor(g, txt) }, ...ctx];
  const t0 = performance.now();

  try{
    let res;
    const cap = g.mode === "team" ? Math.max(g.max, card.max) : g.max;
    if(g.mode === "race") res = await runRace(g.pool, messages, cap, node, bd, who);
    else                  res = await runTeam(messages, cap, bd, who);

    /* ── أداة الحاسبة: لو النموذج طلب حساباً، نحسبه فعلياً ونعيد الجواب ── */
    let finalText = res.text;
    let calcs = [];
    try{
      calcs = runCalcs(res.text);
      let forcedDone = false;

      /* مسألة رياضية بلا علامات؟ نعيد الصياغة بعلامات إجبارية — لا حساب ذهني */
      if(!calcs.length && card.k === "math"){
        try{
          const forced = await callRetry(
            g.pool[0],
            [
              { role:"system", content:"أنت مصحّح حسابي. لا تحسب ذهنياً إطلاقاً." },
              { role:"user", content: txt },
              { role:"assistant", content: res.text },
              { role:"user", content:
                "أعد كتابة الجواب النهائي. القاعدة الوحيدة: كل عملية حسابية اكتبها بصيغة <<calc: التعبير >> " +
                "ولا تحسبها بنفسك أبداً. استخدم الأرقام من السؤال. بلا شرح إضافي وبلا ذكر للأداة." },
            ],
            Math.min(g.max, 1800), null, null, 40000
          );
          if(forced && forced.text.trim()){
            const c2 = runCalcs(forced.text);
            if(c2.length){ calcs = c2; res.text = forced.text; forcedDone = true; }
          }
        }catch{}
      }

      if(calcs.length){
        const usable = calcs.filter(c => c.value !== null);
        if(usable.length && !forcedDone){
          const list = usable.map(c => `- ${c.expr} = ${c.value}`).join("\n");
          const fixed = await callRetry(
            g.mode === "race" ? g.pool[0] : g.pool[0],
            [
              { role:"system", content: sysFor(g, txt) },
              { role:"user", content: txt },
              { role:"assistant", content: res.text },
              { role:"user", content:
                `هذه نتائج الحسابات الدقيقة (محسوبة آلياً، لا تعترض عليها):\n${list}\n\n` +
                "أعد كتابة الجواب النهائي مستخدماً هذه الأرقام بالضبط. لا تذكر أن هناك حسابات أو أدوات. نفس التنسيق والطول." },
            ],
            Math.min(g.max, 2200), null, null, 45000
          );
          if(fixed && fixed.text.trim()) finalText = fixed.text;
        }
        finalText = fillCalcs(finalText, calcs);
      }
    }catch{ finalText = fillCalcs(res.text, calcs); }

    revealFinal(bd, finalText);
    S.history.push({ role:"assistant", content: finalText });
    saveHist();

    node.appendChild(exportBar({ question: txt, text: finalText, model: g.id }));
    try{ if(calcs.length){ const cb = calcBadge(calcs); if(cb) node.appendChild(cb); } }catch{}
    try{ const vb = verifyBadge(verifyBlocks(finalText), txt); if(vb) node.appendChild(vb); }catch{}

    const ms = (performance.now() - t0) / 1000;
    who.innerHTML = `<span class="nm">${esc(g.id)}</span><span>${ms.toFixed(1)}s</span>`;
  }catch(err){
    if(err.name === "AbortError" || S.stopped){
      bd.innerHTML = '<p style="color:#8a8a8a">تعذر — تمت المقاطعة</p>';
    } else {
      /* لا نحذف سؤال المستخدم — نعرض خطأ + زر إعادة */
      S.history.pop();               /* نشيل سؤاله من السياق فقط */
      bd.innerHTML = `<p style="color:#e79a9a">تعذّر — ${esc(err.message)}</p>`;
      const retry = document.createElement("button");
      retry.className = "retry";
      retry.textContent = "إعادة المحاولة";
      retry.onclick = ()=>{
        /* لا تحذف شيئاً — سؤال المستخدم أُزيل أصلاً في catch */
        ta.value = txt;
        ta.dispatchEvent(new Event("input"));
        node.remove();
        $("#form").requestSubmit();
      };
      bd.appendChild(retry);
    }
  }finally{
    S.busy = false; S.stopped = false; setSendMode(false); S.aborter = null;
  }
};

function ago(ts){
  const m = Math.floor((Date.now() - ts) / 60000);
  if(m < 1) return "الآن";
  if(m < 60) return `قبل ${m} دقيقة`;
  const h = Math.floor(m / 60);
  if(h < 24) return `قبل ${h} ساعة`;
  const d = Math.floor(h / 24);
  return d === 1 ? "أمس" : `قبل ${d} يوم`;
}

function slug(t){
  return (t || "ayso").replace(/[\\/:*?"<>|]/g,"").trim().slice(0,40).replace(/\s+/g,"_") || "ayso";
}

function download(name, text, mime){
  const blob = new Blob([text], { type: mime + ";charset=utf-8" });
  const a = document.createElement("a");
  a.href = URL.createObjectURL(blob);
  a.download = name;
  document.body.appendChild(a); a.click();
  setTimeout(()=>{ URL.revokeObjectURL(a.href); a.remove(); }, 400);
}

(function restore(){
  /* آخر محادثة محفوظة تحتل الصدارة */
  const all = readConvs();
  if(all.length && !S.history.length){
    S.cid = all[0].id;
    S.history = all[0].msgs.slice();
  }
  if(!S.history.length) return;
  showHero(false);
  const box = $("#msgs");
  S.history.forEach(m=>{
    const d = document.createElement("div");
    if(m.role === "user"){
      d.className = "msg u"; d.innerHTML = `<div class="b">${esc(m.content)}</div>`;
    } else {
      d.className = "msg a";
      d.innerHTML = `<div class="who">${esc(S.active)}</div><div class="bd">${md(m.content)}</div>`;
      const q = [...S.history].slice(0, S.history.indexOf(m))
        .reverse().find(x => x.role === "user");
      try{ d.appendChild(exportBar({ question: q ? q.content : "ayso", text: m.content, model: S.active })); }
      catch{}
    }
    box.appendChild(d);
  });
  /* آخر رسالة بلا رد؟ اعرض زر إعادة المحاولة */
  const last = S.history[S.history.length - 1];
  if(last && last.role === "user"){
    const wrap = document.createElement("div");
    wrap.className = "msg a";
    wrap.innerHTML = `<div class="who">${esc(S.active)}</div>`;
    const b = document.createElement("button");
    b.className = "retry";
    b.textContent = "إعادة المحاولة";
    b.onclick = ()=>{
      /* السؤال موجود في الذاكرة — لا تحذفه */
      const q = last;
      wrap.remove();
      ta.value = q.content;
      ta.dispatchEvent(new Event("input"));
      $("#form").requestSubmit();
    };
    wrap.appendChild(b);
    box.appendChild(wrap);
  }

  const mm = $("#main"); requestAnimationFrame(()=>{ mm.scrollTop = mm.scrollHeight; });
})();

if(!S.history.length) showHero(true);

if(IS_PREVIEW){
  const b = document.getElementById("pvbar");
  if(b) b.style.display = "block";
}

renderModel();
renderDeep();

</script>
</body>
</html>
