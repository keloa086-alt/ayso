<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Ayso · Terminal</title>
<style>
  :root{
    --bg:#0b0b0d; --pnl:#131317; --ln:#26262c; --tx:#e8e8ec;
    --dim:#8b8b96; --acc:#7c8cff; --ok:#4ade80; --bad:#f87171;
    --mono:ui-monospace,SFMono-Regular,"SF Mono",Menlo,Consolas,"Courier New",monospace;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{height:100%;margin:0}
  body{
    background:var(--bg);color:var(--tx);
    font-family:var(--mono);
    display:flex;flex-direction:column;
    overflow:hidden;
  }

  /* ── شريط علوي ── */
  header{
    display:flex;align-items:center;gap:10px;
    padding:10px 14px;border-bottom:1px solid var(--ln);
    background:var(--pnl);flex:0 0 auto;
  }
  .dot{width:10px;height:10px;border-radius:50%;background:var(--bad)}
  .dot.on{background:var(--ok)}
  .ttl{font-size:13px;color:var(--dim);flex:1;direction:ltr;text-align:left}
  .ttl b{color:var(--tx);font-weight:600}
  .btn{
    background:#1c1c22;color:var(--tx);border:1px solid var(--ln);
    border-radius:8px;padding:6px 10px;font:inherit;font-size:12px;
    cursor:pointer;font-family:inherit;
  }
  .btn:hover{border-color:#3a3a44}
  .btn:active{transform:scale(.97)}

  /* ── شاشة التيرمنال ── */
  #screen{
    flex:1 1 auto;overflow-y:auto;padding:14px 16px 40px;
    direction:ltr;text-align:left;
    font-size:13px;line-height:1.55;
    white-space:pre-wrap;word-break:break-word;
    cursor:text;
  }
  #screen::-webkit-scrollbar{width:10px}
  #screen::-webkit-scrollbar-thumb{background:#2a2a32;border-radius:6px}

  /* مؤشّر الكتابة */
  .cur{
    display:inline-block;width:8px;height:15px;background:var(--acc);
    vertical-align:-2px;animation:bl 1s steps(1) infinite;
  }
  @keyframes bl{50%{opacity:0}}

  /* ── دخول ── */
  #gate{
    position:fixed;inset:0;background:var(--bg);
    display:flex;flex-direction:column;align-items:center;justify-content:center;
    gap:14px;padding:24px;z-index:10;direction:rtl;
  }
  #gate h1{font-size:19px;margin:0;font-weight:600;font-family:system-ui,sans-serif}
  #gate p{color:var(--dim);font-size:13px;margin:0;font-family:system-ui,sans-serif;text-align:center}
  #pw{
    background:#141419;border:1px solid var(--ln);color:var(--tx);
    border-radius:10px;padding:12px 14px;font:inherit;font-size:14px;
    width:min(320px,90vw);text-align:center;direction:ltr;
  }
  #pw:focus{outline:none;border-color:var(--acc)}
  #go{
    background:var(--acc);color:#0b0b0d;border:0;border-radius:10px;
    padding:12px 28px;font:inherit;font-size:14px;font-weight:700;
    font-family:system-ui,sans-serif;cursor:pointer;width:min(320px,90vw);
  }
  #gate .err{color:var(--bad);font-size:12px;min-height:16px;font-family:system-ui,sans-serif}

  /* ── أزرار سفلية (موبايل) ── */
  #keys{
    display:none;gap:6px;padding:8px;border-top:1px solid var(--ln);
    background:var(--pnl);flex-wrap:wrap;justify-content:center;
  }
  #keys .btn{padding:8px 12px;font-size:13px}
  @media (pointer:coarse){#keys{display:flex}}

  #hidden{position:absolute;left:-9999px;top:0}
</style>
</head>
<body>

<header>
  <span class="dot" id="dot"></span>
  <div class="ttl"><b>ayso</b> · bash</div>
  <button class="btn" id="btnClr" title="تفريغ الشاشة">مسح</button>
  <button class="btn" id="btnCtrl" title="Ctrl+C">⌃C</button>
</header>

<div id="screen" tabindex="0"></div>

<div id="keys">
  <button class="btn" data-k="Tab">Tab</button>
  <button class="btn" data-k="ArrowUp">↑</button>
  <button class="btn" data-k="ArrowDown">↓</button>
  <button class="btn" data-k="Escape">Esc</button>
  <button class="btn" data-k="CtrlC">Ctrl+C</button>
  <button class="btn" data-k="CtrlD">Ctrl+D</button>
</div>

<textarea id="hidden" autocomplete="off" autocorrect="off" autocapitalize="off" spellcheck="false"></textarea>

<div id="gate">
  <h1>Ayso · Terminal</h1>
  <p>تيرمنال bash على السيرفر — يحتاج كلمة المرور</p>
  <input id="pw" type="password" placeholder="كلمة المرور" autocomplete="current-password">
  <button id="go">دخول</button>
  <div class="err" id="gerr"></div>
</div>

<script>
(()=>{
"use strict";

const screenEl = document.getElementById("screen");
const gate     = document.getElementById("gate");
const pwEl     = document.getElementById("pw");
const gerr     = document.getElementById("gerr");
const dot      = document.getElementById("dot");
const hidden   = document.getElementById("hidden");
const MAXCH    = 120000;

let ws = null, buf = "", joined = false;

/* ── تنظيف رموز ANSI (الألوان تُحذف، النص يبقى) ── */
function clean(s){
  return s
    .replace(/\x1b\[[0-9;?]*[ -\/]*[@-~]/g, "")   /* CSI */
    .replace(/\x1b\][^\x07\x1b]*(\x07|\x1b\\)/g, "") /* OSC */
    .replace(/\x1b[@-_]/g, "")                     /* حرف واحد */
    .replace(/\r(?!\n)/g, "");
}

function paint(txt){
  if(!txt) return;
  const atBottom = screenEl.scrollHeight - screenEl.scrollTop - screenEl.clientHeight < 60;
  buf += txt;
  if(buf.length > MAXCH) buf = buf.slice(-MAXCH);
  screenEl.textContent = buf;
  if(atBottom) screenEl.scrollTop = screenEl.scrollHeight;
}

function send(s){ if(ws && ws.readyState === 1) ws.send(s); }

/* ── الاتصال ── */
function connect(pass){
  const proto = location.protocol === "https:" ? "wss:" : "ws:";
  const url = `${proto}//${location.host}/api/term?p=${encodeURIComponent(pass)}`;
  ws = new WebSocket(url);
  ws.binaryType = "arraybuffer";

  ws.onopen = ()=>{
    dot.classList.add("on");
    if(!joined){ gate.style.display = "none"; joined = true; focusHidden(); }
  };
  ws.onmessage = ev=>{
    if(typeof ev.data === "string"){
      const c = clean(ev.data);
      if(c.includes("كلمة المرور غير صحيحة")){
        gate.style.display = "flex";
        gerr.textContent = "كلمة المرور غلط";
        joined = false;
        try{ ws.close(); }catch{}
        return;
      }
      paint(c);
    }else{
      paint(clean(new TextDecoder("utf-8").decode(new Uint8Array(ev.data))));
    }
  };
  ws.onclose = ()=>{
    dot.classList.remove("on");
    if(joined) paint("\n\r[session ended]\n");
  };
  ws.onerror = ()=>{ gerr.textContent = "ما قدر يتصل — تحقق من السيرفر"; };
}

/* ── كلمة السر محفوظة؟ ── */
let saved = "";
try{ saved = localStorage.getItem("ayso.term.pass") || ""; }catch{}
if(saved){ connect(saved); } else { pwEl.focus(); }

document.getElementById("go").onclick = ()=>{
  const p = pwEl.value.trim();
  if(!p){ gerr.textContent = "اكتب كلمة المرور"; return; }
  try{ localStorage.setItem("ayso.term.pass", p); }catch{}
  gerr.textContent = "";
  connect(p);
};
pwEl.onkeydown = e=>{ if(e.key === "Enter") document.getElementById("go").click(); };

/* ── لوحة المفاتيح ── */
function focusHidden(){ try{ hidden.focus({preventScroll:true}); }catch{ hidden.focus(); } }

screenEl.addEventListener("click", focusHidden);
screenEl.addEventListener("touchstart", focusHidden, {passive:true});

const CTRL = { "c":"\x03","d":"\x04","l":"\x0c","z":"\x1a","a":"\x01","e":"\x05","k":"\x0b","u":"\x15","w":"\x17","r":"\x12" };

hidden.addEventListener("keydown", e=>{
  if(e.ctrlKey && CTRL[e.key.toLowerCase()]){
    e.preventDefault(); send(CTRL[e.key.toLowerCase()]); return;
  }
  if(e.metaKey || e.altKey) return;

  const k = e.key;
  if(k === "Enter"){ e.preventDefault(); send("\r"); }
  else if(k === "Backspace"){ e.preventDefault(); send("\x7f"); }
  else if(k === "Tab"){
    e.preventDefault();
    send(e.shiftKey ? "\x1b[Z" : "\t");
  }
  else if(k === "ArrowUp"){ e.preventDefault(); send("\x1b[A"); }
  else if(k === "ArrowDown"){ e.preventDefault(); send("\x1b[B"); }
  else if(k === "ArrowRight"){ e.preventDefault(); send("\x1b[C"); }
  else if(k === "ArrowLeft"){ e.preventDefault(); send("\x1b[D"); }
  else if(k === "Escape"){ e.preventDefault(); send("\x1b"); }
  else if(k === "Home"){ e.preventDefault(); send("\x1b[H"); }
  else if(k === "End"){ e.preventDefault(); send("\x1b[F"); }
  else if(k.length === 1){ e.preventDefault(); send(k); }
});

/* أزرار الموبايل */
document.querySelectorAll("#keys .btn").forEach(b=>{
  b.onclick = ()=>{
    const k = b.dataset.k;
    if(k === "CtrlC") send("\x03");
    else if(k === "CtrlD") send("\x04");
    else if(k === "Tab") send("\t");
    else if(k === "Escape") send("\x1b");
    else if(k === "ArrowUp") send("\x1b[A");
    else if(k === "ArrowDown") send("\x1b[B");
    focusHidden();
  };
});

document.getElementById("btnClr").onclick = ()=>{ buf = ""; screenEl.textContent = ""; focusHidden(); };
document.getElementById("btnCtrl").onclick = ()=>{ send("\x03"); focusHidden(); };

})();
</script>
</body>
</html>
